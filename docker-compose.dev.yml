version: '3.8'

# Development version with hot-reload and debugging

services:
  server:
    image: analog-dance-pad:server-dev
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: adp-server-dev
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: development
    restart: unless-stopped
    volumes:
      - ./server/src:/app/src
      - /app/node_modules
    networks:
      - adp-network
    # For USB device access (uncomment if needed):
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # privileged: true

  client:
    image: analog-dance-pad:client-dev
    build:
      context: .
      dockerfile: Dockerfile.client.dev
    container_name: adp-client-dev
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://server:3333
      WATCHPACK_POLLING: 100
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - /app/node_modules
    networks:
      - adp-network
    stdin_open: true
    tty: true

networks:
  adp-network:
    driver: bridge
