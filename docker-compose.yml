services:
  server:
    image: analog-dance-pad:server
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: adp-server
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - adp-network
    # Optional: for direct USB access, uncomment this:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # privileged: true

  client:
    image: analog-dance-pad:client
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: adp-client
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - adp-network
    # Optional: for development with hot reload:
    # build:
    #   context: ./client
    #   dockerfile: Dockerfile.dev
    # volumes:
    #   - ./client/src:/app/src
    #   - /app/node_modules

networks:
  adp-network:
    driver: bridge
