services:
  server:
    image: analog-dance-pad:server
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: adp-server
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - adp-network
    # USB/HID device access for dance pad hardware
    # node-hid requires access to /dev/hidraw* devices
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
    device_cgroup_rules:
      - 'c *:* rmw'

  client:
    image: analog-dance-pad:client
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: adp-client
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - adp-network
    # Optional: for development with hot reload:
    # build:
    #   context: ./client
    #   dockerfile: Dockerfile.dev
    # volumes:
    #   - ./client/src:/app/src
    #   - /app/node_modules

networks:
  adp-network:
    driver: bridge
